[package]
name = "arkworks-phase2"
version = "0.1.0"
edition = "2021"
repository = "https://github.com/Tetration-Lab/arkworks-phase2"
description = "Arkworks implementation of Groth16's CRS generation ceremony"
license = "LGPL-3.0-only"

[dependencies]
ark-ff = { version = "^0.5.0", default-features = false }
ark-ec = { version = "^0.5.0", default-features = false }
ark-poly = { version = "^0.5.0", default-features = false }
ark-r1cs-std = { version = "^0.5.0", default-features = false }
ark-std = { version = "^0.5.0", default-features = false }
ark-relations = { version = "^0.5.0", default-features = false }
ark-groth16 = { version = "^0.5.0", default-features = false }
ark-serialize = { version = "^0.5.0", default-features = false, features = ["derive"] }

rand = "0.8.5"
thiserror = "1.0.40"
rand_chacha = "0.3.1"
blake3 = "0.1.3"
num-bigint = "0.4"

rayon = { version = "^1.7.0", optional = true }

# Matching zetta-privacy/zetta deps
[patch.crates-io]
ark-groth16 = { git = "https://github.com/lazovicff/groth16", rev = "29e2128807c0c73fb737e1a60cfe54ab67099703" }
ark-ff = { git = "https://github.com/arkworks-rs/algebra", rev = "c1f4f5665504154a9de2345f464b0b3da72c28ec" }
ark-ec = { git = "https://github.com/arkworks-rs/algebra", rev = "c1f4f5665504154a9de2345f464b0b3da72c28ec" }
ark-serialize = { git = "https://github.com/arkworks-rs/algebra", rev = "c1f4f5665504154a9de2345f464b0b3da72c28ec" }
ark-poly = { git = "https://github.com/arkworks-rs/algebra", rev = "c1f4f5665504154a9de2345f464b0b3da72c28ec" }
ark-relations = { git = "https://github.com/arkworks-rs/snark" }
ark-snark = { git = "https://github.com/arkworks-rs/snark" }
ark-crypto-primitives = { git = "https://github.com/winderica/crypto-primitives", rev = "af003fc" }
ark-r1cs-std = { git = "https://github.com/winderica/r1cs-std", rev = "ae8283a" }
ark-std = { git = "https://github.com/arkworks-rs/std", rev = "73dcad0" }
ark-poly-commit = { git = "https://github.com/arkworks-rs/poly-commit", rev = "a05ec99d0d3e46c8ba0d6d3592980777bc2847e8" }
ark-bn254 = { git = "https://github.com/arkworks-rs/algebra", rev = "c1f4f5665504154a9de2345f464b0b3da72c28ec" }
ark-grumpkin = { git = "https://github.com/arkworks-rs/algebra", rev = "c1f4f5665504154a9de2345f464b0b3da72c28ec" }
ark-bls12-381 = { git = "https://github.com/arkworks-rs/algebra", rev = "c1f4f5665504154a9de2345f464b0b3da72c28ec" }

[dev-dependencies]
ark-std = { version = "^0.5.0", default-features = false, features = ["print-trace"] }
ark-bn254 = { version = "^0.5.0", default-features = false, features = ["curve"] }
ark-snark = { version = "^0.5.0", default-features = false }
ark-groth16 = { version = "^0.5.0", default-features = false, features = ["parallel"] }

[features]
default = ["std"]
no-std = []
parallel = ["rayon", "ark-ff/parallel", "ark-ec/parallel", "ark-std/parallel", "ark-r1cs-std/parallel", "ark-poly/parallel", "ark-groth16/parallel"]
std = ["ark-std/std", "ark-ff/std", "ark-ec/std", "ark-r1cs-std/std", "ark-poly/std", "ark-relations/std", "ark-groth16/std", "ark-serialize/std"]
